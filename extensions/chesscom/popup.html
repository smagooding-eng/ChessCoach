<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; width: 290px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0D1516; color: #F5F7F6; }
  .wrap { padding: 16px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .head img { width: 36px; height: 36px; border-radius: 9px; }
  .head b { font-size: 16px; font-weight: 800; }
  p { margin: 0 0 12px; font-size: 12.5px; line-height: 1.45; color: #AEB6B3; }
  a.btn { display: block; text-align: center; padding: 10px; border-radius: 12px; font-size: 14px; font-weight: 800; text-decoration: none; margin-top: 8px; }
  .primary { background: #81B64C; color: #0B1213; }
  .secondary { background: #121B1D; color: #E6EBE9; border: 1px solid rgba(255,255,255,.08); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><img src="icons/icon-48.png" alt="" /><b>ChessScout.net</b></div>
    <p>When a Chess.com game ends, a <b>Review this game free</b> button appears in the corner. It never shows during a game.</p>
    <a class="btn primary" href="https://chessscout.net/cc/latest" target="_blank" rel="noopener">Review my latest Chess.com game</a>
    <a class="btn secondary" href="https://chessscout.net/" target="_blank" rel="noopener">Open ChessScout</a>
  </div>
</body>
</html>
