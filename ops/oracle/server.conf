# ChessScout on Oracle Cloud: settings shared by the scripts in this folder.
# Safe to commit (no secrets). Secrets live only on the server in /opt/chessscout/*.env.
REPO_URL=https://github.com/smagooding-eng/ChessCoach.git
API_DOMAIN=api.chessscout.net              # live API (Caddy gets its certificate)
PREVIEW_API_DOMAIN=api-preview.chessscout.net
SITE=https://chessscout.net
PREVIEW_SITE=https://preview.chessscout.net
PROD_BRANCH=main
PREVIEW_BRANCH=preview
PROD_PORT=8080
PREVIEW_PORT=8081
PG_MAJOR=18
DB_PROD=chessscout
DB_PREVIEW=chessscout_preview
DB_USER=chessscout
# Node memory for the server (Render needed 280 MB; this machine has 12 GB)
NODE_HEAP_MB=2048
ADMIN_EMAIL=smagooding@gmail.com           # the preview server only emails / notifies this address
