    <style>
      body { margin: 0; background: #141413; }
      #splash {
        position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #141413;
        font-family: Inter, system-ui, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      @keyframes splashFallbackHide {
        0%, 90% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; pointer-events: none; }
      }
      #splash { animation: splashFallbackHide 5s ease forwards; }

      /* ── Splash: the black rook jumps two squares and smashes the white pawn ──
         One ~1s timeline (impact at 0.68s), then an idle glow while the app loads. */
      .sp-stage { width: min(280px, 76vw); height: auto; overflow: visible; }
      .sp-stage * { transform-box: fill-box; }
      .sp-shake { animation: spShake .26s linear .68s 1; transform-origin: 50% 50%; }
      @keyframes spShake {
        0% { transform: translate(0,0); } 20% { transform: translate(-3px,2px); } 40% { transform: translate(3px,-2px); }
        60% { transform: translate(-2px,1px); } 80% { transform: translate(1px,-1px); } 100% { transform: translate(0,0); }
      }
      .sp-board { opacity: 0; animation: spFade .3s ease-out forwards; }
      @keyframes spFade { to { opacity: 1; } }
      .sp-flash { opacity: 0; animation: spFlash .7s ease-out .68s forwards; }
      @keyframes spFlash { 0% { opacity: .85; } 100% { opacity: .16; } }

      /* rook: position along a jump arc (linear between points = smooth parabola) */
      .sp-rook-pos { transform: translate(60px,110px); animation: spArc 1s linear forwards; }
      @keyframes spArc {
        0%, 28% { transform: translate(60px,110px); }
        33% { transform: translate(75px,83px); }   38% { transform: translate(90px,63.5px); }
        43% { transform: translate(105px,51.9px); } 48% { transform: translate(120px,48px); }
        53% { transform: translate(135px,51.9px); } 58% { transform: translate(150px,63.5px); }
        63% { transform: translate(165px,83px); }  68%, 100% { transform: translate(180px,110px); }
      }
      /* rook: squash & stretch, origin at its base */
      .sp-rook-body { transform-origin: 50% 100%; animation: spSquash 1s cubic-bezier(.3,.7,.4,1) forwards; }
      @keyframes spSquash {
        0%, 20% { transform: scale(1,1) rotate(0); }
        28% { transform: scale(1.1,.86) rotate(0); }
        34% { transform: scale(.9,1.12) rotate(-7deg); }
        48% { transform: scale(1,1) rotate(3deg); }
        63% { transform: scale(.94,1.08) rotate(2deg); }
        68% { transform: scale(1.2,.78) rotate(0); }
        76% { transform: scale(.95,1.06); }
        85% { transform: scale(1.03,.97); }
        100% { transform: scale(1,1); }
      }
      .sp-shadow { transform-origin: 50% 50%; animation: spShadow 1s linear forwards; }
      @keyframes spShadow {
        0%, 28% { transform: translateX(0) scale(1); opacity: .55; }
        48% { transform: translateX(60px) scale(.45); opacity: .2; }
        68%, 100% { transform: translateX(120px) scale(1.05); opacity: .55; }
      }
      .sp-glow { opacity: 0; transform-origin: 50% 50%; animation: spGlowIn .6s ease-out .75s forwards, spGlow 2.4s ease-in-out 1.35s infinite; }
      @keyframes spGlowIn { from { opacity: 0; transform: scale(.6); } to { opacity: .55; transform: scale(1); } }
      @keyframes spGlow { 0%, 100% { opacity: .55; } 50% { opacity: .25; } }

      /* pawn: nervous wobble while the rook is in the air, then gone */
      .sp-pawn { transform-origin: 50% 100%; animation: spNervous .24s ease-in-out .4s 1, spNervous .2s ease-in-out .58s 1; }
      @keyframes spNervous { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
      .sp-shard { transform-origin: 50% 50%; animation: spShard .62s cubic-bezier(.15,.6,.35,1) .68s forwards; }
      @keyframes spShard {
        0% { transform: translate(0,0) rotate(0); opacity: 1; }
        40% { transform: translate(calc(var(--dx) * .55), calc(var(--dy) * .7)) rotate(calc(var(--r) * .5)); opacity: 1; }
        100% { transform: translate(var(--dx), calc(var(--dy) + 16px)) rotate(var(--r)); opacity: 0; }
      }
      /* the intact pawn sits over the shards (no seams) and vanishes on impact */
      .sp-pawn-whole { animation: spGone 0s linear .68s forwards; }
      @keyframes spGone { to { opacity: 0; } }
      .sp-pop { opacity: 0; transform-origin: 50% 50%; animation: spPop .3s ease-out .68s forwards; }
      @keyframes spPop { 0% { opacity: .9; transform: scale(.2); } 100% { opacity: 0; transform: scale(1.4); } }
      .sp-ring { opacity: 0; transform-origin: 50% 50%; animation: spRing .55s cubic-bezier(.1,.7,.3,1) .68s forwards; }
      @keyframes spRing { 0% { opacity: .95; transform: scale(.12); } 100% { opacity: 0; transform: scale(1); } }
      .sp-spark { opacity: 0; transform-origin: 50% 50%; animation: spSpark .5s cubic-bezier(.1,.8,.3,1) .68s forwards; }
      @keyframes spSpark {
        0% { opacity: 1; transform: translate(0,0) scale(1); }
        100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
      }

      .splash-title {
        margin-top: 18px;
        font-size: 26px; font-weight: 900; letter-spacing: -0.5px;
        color: #e5e5e0;
        opacity: 0;
        animation: fadeUp 0.5s ease 0.8s forwards;
      }
      .splash-title span { color: #81b64c; }
      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      /* tagline under the name (replaced the loading bar) */
      .splash-tag {
        margin-top: 10px;
        font-size: 15px; font-weight: 800; letter-spacing: -0.2px;
        color: rgba(229,229,224,0.78);
        opacity: 0;
        animation: fadeUp 0.5s ease 1.05s forwards;
      }
      .splash-tag span { color: #81b64c; }
      .splash-bar-wrap {
        margin-top: 20px;
        width: 160px; height: 3px;
        background: rgba(129,182,76,0.15);
        border-radius: 4px; overflow: hidden;
        opacity: 0;
        animation: fadeUp 0.5s ease 1s forwards;
      }
      .splash-bar {
        height: 100%; width: 30%;
        background: linear-gradient(90deg, #81b64c, #a3cf6f);
        border-radius: 4px;
        animation: barSlide 1.4s ease-in-out infinite;
      }
      @keyframes barSlide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(533%); }
      }
      /* Reduced motion: just the result -- the rook standing on the pawn's square. */
      @media (prefers-reduced-motion: reduce) {
        .sp-stage *, .splash-title, .splash-bar-wrap, .splash-tag { animation: none !important; }
        .sp-rook-pos { transform: translate(180px,110px); }
        .sp-shadow { transform: translateX(120px); opacity: .55; }
        .sp-pawn, .sp-ring, .sp-spark, .sp-pop { display: none; }
        .sp-board, .splash-title, .splash-bar-wrap, .splash-tag { opacity: 1; }
        .sp-flash { opacity: .16; }
        .sp-glow { opacity: .4; }
      }
    </style>

  <body>
    <div id="splash">
      <svg class="sp-stage" viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg" aria-label="ChessScout loading" role="img">
        <defs>
          <linearGradient id="spRookFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3a3a37"/><stop offset=".55" stop-color="#181817"/><stop offset="1" stop-color="#0a0a09"/>
          </linearGradient>
          <linearGradient id="spPawnFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e9e8e2"/><stop offset="1" stop-color="#bdbcb4"/>
          </linearGradient>
          <radialGradient id="spPopFill"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#d9f0bf" stop-opacity=".45"/><stop offset="1" stop-color="#81b64c" stop-opacity="0"/></radialGradient>
          <radialGradient id="spGlowFill"><stop offset="0" stop-color="#81b64c" stop-opacity=".7"/><stop offset="1" stop-color="#81b64c" stop-opacity="0"/></radialGradient>
          <g id="spPawnShape">
            <path d="M-18,0 L18,0 Q18,-8 11,-10 Q6,-14 6,-26 L10,-27 Q12,-30 9,-32 L-9,-32 Q-12,-30 -10,-27 L-6,-26 Q-6,-14 -11,-10 Q-18,-8 -18,0 Z" fill="url(#spPawnFill)" stroke="#1a1a19" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="0" cy="-41" r="10" fill="url(#spPawnFill)" stroke="#1a1a19" stroke-width="1.6"/>
            <path d="M-5,-46 Q-1,-50 4,-48" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9"/>
          </g>
          <clipPath id="spC1"><polygon points="-21,-53 2,-53 -3,-38 -21,-36"/></clipPath>
          <clipPath id="spC2"><polygon points="2,-53 21,-53 21,-34 -3,-38"/></clipPath>
          <clipPath id="spC3"><polygon points="-21,-36 -3,-38 0,-20 -21,-16"/></clipPath>
          <clipPath id="spC4"><polygon points="-3,-38 21,-34 21,-14 0,-20"/></clipPath>
          <clipPath id="spC5"><polygon points="-21,-16 0,-20 4,2 -21,2"/></clipPath>
          <clipPath id="spC6"><polygon points="0,-20 21,-14 21,2 4,2"/></clipPath>
        </defs>
        <g class="sp-shake">
          <!-- three squares of a rank -->
          <g class="sp-board">
            <rect x="30" y="110" width="60" height="16" fill="#2b2b28"/>
            <rect x="90" y="110" width="60" height="16" fill="#e9e8e2"/>
            <rect x="150" y="110" width="60" height="16" fill="#2b2b28"/>
            <rect class="sp-flash" x="150" y="110" width="60" height="16" fill="#81b64c"/>
            <rect x="30" y="126" width="180" height="5" rx="1.5" fill="#0c0c0b"/>
            <line x1="30" y1="110.5" x2="210" y2="110.5" stroke="#e5e5e0" stroke-opacity=".12"/>
          </g>
          <ellipse class="sp-glow" cx="180" cy="110" rx="46" ry="12" fill="url(#spGlowFill)"/>
          <ellipse class="sp-shadow" cx="60" cy="111" rx="24" ry="4" fill="#000"/>

          <!-- white pawn: whole while waiting, six shards on impact -->
          <g transform="translate(180,110)">
            <g class="sp-pawn">
              <g class="sp-shard" clip-path="url(#spC1)" style="--dx:-34px;--dy:-46px;--r:-160deg"><use href="#spPawnShape"/></g>
              <g class="sp-shard" clip-path="url(#spC2)" style="--dx:38px;--dy:-50px;--r:190deg"><use href="#spPawnShape"/></g>
              <g class="sp-shard" clip-path="url(#spC3)" style="--dx:-46px;--dy:-24px;--r:-110deg"><use href="#spPawnShape"/></g>
              <g class="sp-shard" clip-path="url(#spC4)" style="--dx:50px;--dy:-22px;--r:130deg"><use href="#spPawnShape"/></g>
              <g class="sp-shard" clip-path="url(#spC5)" style="--dx:-40px;--dy:-6px;--r:-70deg"><use href="#spPawnShape"/></g>
              <g class="sp-shard" clip-path="url(#spC6)" style="--dx:42px;--dy:-8px;--r:80deg"><use href="#spPawnShape"/></g>
              <use class="sp-pawn-whole" href="#spPawnShape"/>
            </g>
            <ellipse class="sp-ring" cx="0" cy="0" rx="62" ry="13" fill="none" stroke="#81b64c" stroke-width="2.5"/>
            <circle class="sp-spark" cx="0" cy="-6" r="2.2" fill="#e5e5e0" style="--dx:-58px;--dy:-30px"/>
            <circle class="sp-spark" cx="0" cy="-6" r="1.8" fill="#81b64c" style="--dx:56px;--dy:-36px"/>
            <circle class="sp-spark" cx="0" cy="-6" r="1.6" fill="#e5e5e0" style="--dx:-30px;--dy:-58px"/>
            <circle class="sp-spark" cx="0" cy="-6" r="2" fill="#a3cf6f" style="--dx:28px;--dy:-60px"/>
            <circle class="sp-spark" cx="0" cy="-4" r="1.5" fill="#e5e5e0" style="--dx:-70px;--dy:-6px"/>
            <circle class="sp-spark" cx="0" cy="-4" r="1.5" fill="#e5e5e0" style="--dx:70px;--dy:-4px"/>
            <circle class="sp-spark" cx="0" cy="-8" r="1.3" fill="#81b64c" style="--dx:-8px;--dy:-72px"/>
          </g>

          <!-- black rook -->
          <g class="sp-rook-pos">
            <g class="sp-rook-body">
              <path d="M-22,0 L22,0 L22,-7 L18,-10 L18,-14 L13,-17 L12,-44 L17,-47 L17,-64 L10,-64 L10,-57 L4,-57 L4,-64 L-4,-64 L-4,-57 L-10,-57 L-10,-64 L-17,-64 L-17,-47 L-12,-44 L-13,-17 L-18,-14 L-18,-10 L-22,-7 Z"
                fill="url(#spRookFill)" stroke="#e5e5e0" stroke-width="2" stroke-linejoin="round"/>
              <path d="M-12,-44 L12,-44 M-13,-17 L13,-17 M-18,-10 L18,-10" stroke="#e5e5e0" stroke-opacity=".28" stroke-width="1.2"/>
              <path d="M-8,-40 L-9,-21" stroke="#fff" stroke-opacity=".16" stroke-width="2.5" stroke-linecap="round"/>
            </g>
          </g>
          <!-- impact flash, in front of everything -->
          <circle class="sp-pop" cx="180" cy="92" r="30" fill="url(#spPopFill)"/>
        </g>
      </svg>
      <div class="splash-title">Chess<span>Scout</span>.net</div>
      <div class="splash-tag">Play smarter. <span>Win more.</span></div>
    </div>
    <div id="root"></div>
    <script>
      // Older iPads / Safari: small stand-ins for newer built-ins some code expects.
      (function () {
        function def(o, k, v) { if (o && !o[k]) try { Object.defineProperty(o, k, { value: v, writable: true, configurable: true }); } catch (e) { o[k] = v; } }
        var at = function (i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return i < 0 || i >= this.length ? undefined : this[i]; };
        def(Array.prototype, 'at', at); def(String.prototype, 'at', at);
        def(Array.prototype, 'findLast', function (f, t) { for (var i = this.length - 1; i >= 0; i--) if (f.call(t, this[i], i, this)) return this[i]; });
        def(Array.prototype, 'findLastIndex', function (f, t) { for (var i = this.length - 1; i >= 0; i--) if (f.call(t, this[i], i, this)) return i; return -1; });
        def(Object, 'hasOwn', function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); });
        if (typeof window.structuredClone !== 'function') window.structuredClone = function (v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); };
        if (window.crypto && !window.crypto.randomUUID) window.crypto.randomUUID = function () {
          var b = new Uint8Array(16); window.crypto.getRandomValues(b); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
          var h = []; for (var i = 0; i < 16; i++) h.push((b[i] + 256).toString(16).slice(1));
          return h.slice(0, 4).join('') + '-' + h.slice(4, 6).join('') + '-' + h.slice(6, 8).join('') + '-' + h.slice(8, 10).join('') + '-' + h.slice(10).join('');
        };
      })();
      // If the app's code can't run at all (a browser too old for it), say so
      // instead of a blank screen. main.tsx sets __csBoot as its first line;
      // the page's load event only fires once that script has run or failed.
      window.addEventListener('load', function () { setTimeout(function () {
        if (window.__csBoot) return;
        var sp = document.getElementById('splash'); if (sp) sp.style.display = 'none';
        var d = document.createElement('div');
        d.setAttribute('style', 'max-width:420px;margin:15vh auto 0;padding:0 24px;font-family:-apple-system,system-ui,sans-serif;color:#e8e6e3;text-align:center;line-height:1.5');
        d.innerHTML = '<p style="font-size:22px;font-weight:800;margin:0 0 10px">ChessScout.net needs a newer browser</p>' +
          '<p style="color:#9e9b98;margin:0 0 18px">This browser is too old to run the app. On an iPhone or iPad, update it in Settings &rsaquo; General &rsaquo; Software Update. On a computer, update your browser or try Chrome, Edge, Firefox or Safari.</p>' +
          '<a href="" style="display:inline-block;background:#81b64c;color:#fff;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:12px">Try again</a>';
        document.body.appendChild(d);
      }, 1500); });
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var manifestEl = document.querySelector('link[rel="manifest"]');
          var base = '/';
          if (manifestEl) {
            var href = new URL(manifestEl.getAttribute('href'), window.location.href).pathname;
            base = href.substring(0, href.lastIndexOf('/') + 1);
          }
          navigator.serviceWorker.register(base + 'sw.js', { scope: base }).catch(function() {});
        });
      }
    </script>
