    <style>
      body { margin: 0; background: #141413; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #141413;
        font-family: Inter, system-ui, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      @keyframes splashFallbackHide {
        0%, 90% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; pointer-events: none; }
      }
      #splash { animation: splashFallbackHide 5s ease forwards; }

      .splash-rook {
        width: 100px; height: 100px;
        opacity: 0;
        animation: rookAppear 0.8s ease forwards;
      }
      @keyframes rookAppear {
        0% { opacity: 0; transform: scale(0.8) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      .splash-title {
        margin-top: 28px;
        font-size: 26px; font-weight: 900; letter-spacing: -0.5px;
        color: #e5e5e0;
        opacity: 0;
        animation: fadeUp 0.6s ease 0.3s forwards;
      }
      .splash-title span { color: #7cb342; }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .splash-bar-wrap {
        margin-top: 24px;
        width: 160px; height: 3px;
        background: rgba(124,179,66,0.15);
        border-radius: 4px; overflow: hidden;
        opacity: 0;
        animation: fadeUp 0.5s ease 0.6s forwards;
      }
      .splash-bar {
        height: 100%; width: 30%;
        background: linear-gradient(90deg, #7cb342, #9ccc65);
        border-radius: 4px;
        animation: barSlide 1.4s ease-in-out infinite;
      }
      @keyframes barSlide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(533%); }
      }

      .splash-sub {
        margin-top: 12px; font-size: 11px; color: rgba(229,229,224,0.35);
        letter-spacing: 3px; text-transform: uppercase; font-weight: 600;
        opacity: 0;
        animation: fadeUp 0.5s ease 0.6s forwards;
      }
    </style>
  </head>

      <div class="splash-title">Chess<span>Scout.net</span></div>

      <div class="splash-sub">Loading</div>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var manifestEl = document.querySelector('link[rel="manifest"]');
          var base = '/';
          if (manifestEl) {
            var href = new URL(manifestEl.getAttribute('href'), window.location.href).pathname;
            base = href.substring(0, href.lastIndexOf('/') + 1);
          }
          navigator.serviceWorker.register(base + 'sw.js', { scope: base }).catch(function() {});
        });
      }
    </script>
