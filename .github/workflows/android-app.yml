name: Android app (Play Store build)

# Builds the ChessScout Play Store app (a Trusted Web Activity around
# chessscout.net) with notification delegation ON: web push notifications
# are shown by the app itself and controlled by the app's notification
# switch in Android settings, instead of Chrome's per-site permission
# (which Chrome can revoke on its own).
#
# Run it from GitHub > Actions > "Android app (Play Store build)" > Run
# workflow, with a version code higher than the one live on Google Play.
# Download the "chessscout-android" artifact and upload the .aab in Play
# Console > Production (or a testing track) > Create new release.
#
# Signing uses your existing upload key, from repository secrets:
#   ANDROID_KEYSTORE_BASE64   the .keystore file, base64-encoded
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_PASSWORD      key password
# Without them it still builds, signed with a throwaway test key (fine to
# check the build works; Play will reject it).

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (must be higher than the one on Google Play)'
        required: true
      version_name:
        description: 'Version name shown on the store (e.g. 1.5.0)'
        required: true
        default: '1.5.0'
  push:
    branches: [main]
    paths: ['.github/workflows/android-app.yml', 'android/twa-manifest.json']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@1.23.0

      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android.keystore
            echo "alias=$KS_ALIAS" >> "$GITHUB_OUTPUT"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets set: building with a throwaway test key (Play will not accept this build)."
            keytool -genkeypair -keystore android.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testpass -keypass testpass -dname "CN=ChessScout test" >/dev/null 2>&1
            echo "alias=test" >> "$GITHUB_OUTPUT"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=testpass" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=testpass" >> "$GITHUB_ENV"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version and key alias
        run: |
          cd android
          CODE="${{ github.event.inputs.version_code || '1' }}"
          NAME="${{ github.event.inputs.version_name || '0.0.0-test' }}"
          jq --arg a "${{ steps.key.outputs.alias }}" --argjson c "$CODE" --arg n "$NAME" \
            '.signingKey.alias=$a | .appVersionCode=$c | .appVersionName=$n | .appVersion=$n' twa-manifest.json > m.json && mv m.json twa-manifest.json

      - name: Generate the Android project
        run: cd android && bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      # Shows how notifications are wired in the generated app, on the run page.
      - name: Show notification setup
        run: |
          cd android
          M=app/src/main/AndroidManifest.xml
          for pat in POST_NOTIFICATIONS DelegationService TRUSTED_WEB_ACTIVITY_SERVICE PermissionRequestActivity NotificationPermissionRequestActivity SMALL_ICON targetSdkVersion; do
            n=$(grep -c "$pat" "$M" app/build.gradle 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
            echo "::notice title=$pat::$n match(es)"
          done
          grep -h "androidbrowserhelper\|targetSdkVersion\|compileSdkVersion" app/build.gradle | sed 's/^ *//' | while read -r l; do echo "::notice title=gradle::$l"; done
          grep -n "service\|activity android:name\|uses-permission" "$M" | sed 's/^ *//' | head -30 | while read -r l; do echo "::notice title=manifest::$l"; done
          ls app/src/main/java/*/*/*/ 2>/dev/null | head -20 | while read -r l; do echo "::notice title=java::$l"; done

      # Gradle builds the project Bubblewrap generated, then the SDK's own
      # zipalign/apksigner and the JDK's jarsigner sign it. (bubblewrap build
      # stops on interactive checks on a CI runner.)
      - name: Build and sign
        env:
          KS_ALIAS: ${{ steps.key.outputs.alias }}
        run: |
          set -o pipefail
          cd android
          # On failure, surface the tail of the output as annotations so the
          # reason shows on the run page without opening the raw log.
          trap 'tail -25 build.log | sed "s/^/::error::/"' ERR
          exec > >(tee build.log) 2>&1
          ls
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks android.keystore --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:BUBBLEWRAP_KEYSTORE_PASSWORD --key-pass env:BUBBLEWRAP_KEY_PASSWORD \
            --out app-release-signed.apk aligned.apk
          cp app/build/outputs/bundle/release/app-release.aab app-release-bundle.aab
          jarsigner -keystore android.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -keypass "$BUBBLEWRAP_KEY_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 \
            app-release-bundle.aab "$KS_ALIAS"

      # Shows which key signed the bundle, to compare with Play Console >
      # Test and release > App integrity > Upload key certificate.
      - name: Show signing certificate
        run: |
          cd android
          keytool -printcert -jarfile app-release-bundle.aab | grep -E "SHA1|SHA256|Owner" > cert.txt || true
          cat cert.txt
          while read -r l; do echo "::notice title=Upload key used::$l"; done < cert.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chessscout-android${{ steps.key.outputs.release != 'true' && '-TEST-KEY' || '' }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
