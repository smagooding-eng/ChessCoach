name: Android app (Play Store build)

# Builds the ChessScout Play Store app (a Trusted Web Activity around
# chessscout.net) with notification delegation ON: web push notifications
# are shown by the app itself and controlled by the app's notification
# switch in Android settings, instead of Chrome's per-site permission
# (which Chrome can revoke on its own).
#
# Run it from GitHub > Actions > "Android app (Play Store build)" > Run
# workflow, with a version code higher than the one live on Google Play.
# Download the "chessscout-android" artifact and upload the .aab in Play
# Console > Production (or a testing track) > Create new release.
#
# Signing uses your existing upload key, from repository secrets:
#   ANDROID_KEYSTORE_BASE64   the .keystore file, base64-encoded
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_PASSWORD      key password
# Without them it still builds, signed with a throwaway test key (fine to
# check the build works; Play will reject it).

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (must be higher than the one on Google Play)'
        required: true
      version_name:
        description: 'Version name shown on the store (e.g. 1.5.0)'
        required: true
        default: '1.5.0'
  push:
    branches: [main]
    paths: ['.github/workflows/android-app.yml', 'android/twa-manifest.json']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@1.23.0

      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android.keystore
            echo "alias=$KS_ALIAS" >> "$GITHUB_OUTPUT"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets set: building with a throwaway test key (Play will not accept this build)."
            keytool -genkeypair -keystore android.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testpass -keypass testpass -dname "CN=ChessScout test" >/dev/null 2>&1
            echo "alias=test" >> "$GITHUB_OUTPUT"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=testpass" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=testpass" >> "$GITHUB_ENV"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version and key alias
        run: |
          cd android
          CODE="${{ github.event.inputs.version_code || '1' }}"
          NAME="${{ github.event.inputs.version_name || '0.0.0-test' }}"
          jq --arg a "${{ steps.key.outputs.alias }}" --argjson c "$CODE" --arg n "$NAME" \
            '.signingKey.alias=$a | .appVersionCode=$c | .appVersionName=$n | .appVersion=$n' twa-manifest.json > m.json && mv m.json twa-manifest.json

      - name: Generate the Android project
        run: cd android && bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Build and sign
        run: cd android && bubblewrap build --skipPwaValidation

      - uses: actions/upload-artifact@v4
        with:
          name: chessscout-android${{ steps.key.outputs.release == 'true' && '' || '-TEST-KEY' }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
