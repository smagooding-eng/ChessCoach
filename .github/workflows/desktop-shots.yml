name: Desktop screenshots

# Desktop screenshots of the live site (1280 and 1920 wide) for layout
# checks. Encrypted with scripts/desktop-shots.pub.pem and pushed to the
# desktop-shots branch, so signed-in pages never sit in the public repo
# in readable form. Run on demand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      signed_in_only:
        description: 'Skip the public pages'
        required: false
        default: ''
      audit_reviews:
        description: 'Only audit recent reviews (no screenshots)'
        required: false
        default: ''
      only_pages:
        description: 'Comma-separated signed-in page names (blank = all)'
        required: false
        default: ''
      site:
        description: 'Site to shoot (blank = https://chessscout.net)'
        required: false
        default: ''
      sizes:
        description: 'Sizes, e.g. 390x844,1280x720 (blank = 1280 and 1920)'
        required: false
        default: ''
      key:
        description: 'Encrypt for: desktop-shots (default) or claude-shots'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: Sign in for this run
        # A short-lived login for the admin account with the most games, made in the database just
        # for this run and deleted at the end, so signed-in pages never depend on an expiring token.
        env: { RK: "${{ secrets.RENDER_API_KEY }}" }
        run: |
          [ -n "$RK" ] || { echo "No RENDER_API_KEY: signed-in pages use the saved token."; exit 0; }
          H=(-H "Authorization: Bearer $RK" -H "Accept: application/json")
          SID=$(curl -fsS "${H[@]}" "https://api.render.com/v1/services?name=chesscoach-api&limit=1" | jq -r '.[0].service.id')
          DB=$(curl -fsS "${H[@]}" "https://api.render.com/v1/services/$SID/env-vars?limit=100" | jq -r '.[].envVar | select(.key=="DATABASE_URL") | .value')
          if [ -z "$DB" ]; then
            for G in $(curl -fsS "${H[@]}" "https://api.render.com/v1/env-groups?limit=100" | jq -r --arg s "$SID" '.[] | (.envGroup // .) | select([.serviceLinks[]?.id] | index($s)) | .id'); do
              DB=$(curl -fsS "${H[@]}" "https://api.render.com/v1/env-groups/$G" | jq -r '.envVars[]? | select(.key=="DATABASE_URL") | .value'); [ -n "$DB" ] && break
            done
          fi
          [ -n "$DB" ] || { echo "Couldn't find the database address."; exit 0; }
          echo "::add-mask::$DB"
          sudo apt-get install -y -qq postgresql-client >/dev/null
          T=$(openssl rand -hex 32); echo "::add-mask::$T"
          # the session is a copy of the admin's own user row (same fields the app stores at sign-in)
          psql "$DB" -qtA -v ON_ERROR_STOP=1 -c "INSERT INTO sessions (sid, sess, expire) SELECT '$T', json_build_object('user', (to_jsonb(json_build_object('id', u.id, 'firstName', u.first_name, 'lastName', u.last_name, 'profileImageUrl', u.profile_image_url, 'chesscomUsername', u.chesscom_username, 'lichessUsername', u.lichess_username, 'scoutUsername', u.scout_username, 'isAdmin', true, 'inviteCode', u.invite_code, 'emailVerified', true)) || jsonb_build_object('email', u.email))), now() + interval '2 hours' FROM users u WHERE u.is_admin = true ORDER BY (SELECT count(*) FROM games g WHERE g.user_id = u.id) DESC LIMIT 1" >/dev/null
          { echo "DESKTOP_SHOT_TOKEN=$T"; echo "SHOT_DB=$DB"; } >> "$GITHUB_ENV"
          echo "Signed in for this run."
      - name: Take screenshots
        env:
          DESKTOP_SHOT_TOKEN: ${{ env.DESKTOP_SHOT_TOKEN || secrets.DESKTOP_SHOT_TOKEN }}
          SIGNED_IN_ONLY: ${{ github.event.inputs.signed_in_only }}
          ONLY_PAGES: ${{ github.event.inputs.only_pages }}
          SITE: ${{ github.event.inputs.site || 'https://chessscout.net' }}
          SHOT_SIZES: ${{ github.event.inputs.sizes }}
        run: |
          if [ -n "${{ github.event.inputs.audit_reviews }}" ]; then
            OUT=/tmp/shots FRESH_ID=none node scripts/review-audit.mjs
          else
            cp scripts/desktop-shots.mjs /tmp/pw/desktop-shots.mjs
            cd /tmp/pw && OUT=/tmp/shots node desktop-shots.mjs
          fi
      - name: Sign out
        if: always()
        run: |
          [ -n "$SHOT_DB" ] && [ -n "$DESKTOP_SHOT_TOKEN" ] && psql "$SHOT_DB" -qtA -c "DELETE FROM sessions WHERE sid = '$DESKTOP_SHOT_TOKEN'" >/dev/null && echo "Signed out." || true
      - name: Encrypt and push
        run: |
          cd /tmp
          tar czf shots.tgz shots
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in shots.tgz -out shots.tgz.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/scripts/${{ github.event.inputs.key || 'desktop-shots' }}.pub.pem" -in k.txt -out k.enc
          rm k.txt
          mkdir out && cp shots.tgz.enc k.enc out/
          cd out && git init -q && git checkout -q -b desktop-shots
          git config user.name "desktop-shots-bot" && git config user.email "desktop-shots-bot@users.noreply.github.com"
          git add . && git commit -q -m "Desktop screenshots (encrypted)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:${{ github.event.inputs.key == 'claude-shots' && 'claude-shots' || 'desktop-shots' }}"
