name: api-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in /api/healthz /api/live/stats /api/auth/user /api/landing-funnel/ping /api/stripe/products; do
            echo "== $p"; curl -s -o /tmp/o -w "status=%{http_code} time=%{time_total}s\n" --max-time 40 "https://chesscoach-api-kbf8.onrender.com$p"; head -c 300 /tmp/o; echo; done
          echo "== site"; curl -s -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" --max-time 40 https://chessscout.net/
