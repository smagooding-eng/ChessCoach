name: Link preview screenshots

# Re-takes the link-preview screenshots of the live site (see
# scripts/link-preview-shots.mjs) and commits them if they changed.
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-previews.yml'
      - 'scripts/link-preview-shots.mjs'

permissions:
  contents: write

concurrency:
  group: link-previews
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: Take screenshots
        # run from /tmp/pw so the script finds the playwright install there
        run: |
          cp scripts/link-preview-shots.mjs /tmp/pw/shots.mjs
          OUT="$GITHUB_WORKSPACE/artifacts/chess-coach/public/shots" node /tmp/pw/shots.mjs
      - name: Commit if changed
        run: |
          git config user.name "link-preview-bot"
          git config user.email "link-preview-bot@users.noreply.github.com"
          git add artifacts/chess-coach/public/shots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update link preview screenshots"
          git pull --rebase origin main
          git push origin HEAD:main
