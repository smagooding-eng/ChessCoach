name: api-check
# One-off check that the API answers, and that the voiceover (text to speech) works.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://chesscoach-api-kbf8.onrender.com
          echo "::notice title=voices::$(curl -s -m 60 $B/api/tts/voices | head -c 300)"
          for v in ash premium; do
            out=$(curl -s -m 90 -o /tmp/a.mp3 -w '%{http_code} %{size_download} %{content_type}' -X POST -H 'Content-Type: application/json' -d "{\"text\":\"Knight to f3. The Italian Game.\",\"voice\":\"$v\",\"style\":\"studio\"}" $B/api/tts/speak)
            echo "::notice title=tts $v::$out $(head -c 200 /tmp/a.mp3 | tr -cd '[:print:]' | head -c 150)"
          done
